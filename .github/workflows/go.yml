name: Go

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - pkg/agui
          - pkg/elasticsearch
          - pkg/mcp
          - pkg/milvus
          - pkg/mongodb
          - pkg/mysql
          - pkg/otel
          - pkg/redis
          - pkg/s3
          - testdata/consumer

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Check publishable module manifest
        if: matrix.module != '.' && matrix.module != 'testdata/consumer'
        working-directory: ${{ matrix.module }}
        run: |
          if grep -Eq '^replace([[:space:]]|[[:space:]]*\()' go.mod; then
            echo 'Published modules must not contain replace directives' >&2
            exit 1
          fi
          if grep -Eq '[[:space:]]v0\.0\.0([[:space:]]|$)' go.mod; then
            echo 'Published modules must not require placeholder versions' >&2
            exit 1
          fi

      - name: Test with race detector
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go test -race ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go vet ./...

      - name: Staticcheck correctness checks
        working-directory: ${{ matrix.module }}
        # v0.8.1 uses an x/tools version that cannot read Go 1.27 export data.
        run: GOWORK=off go run honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20261009230814-452d5bb86b45 -checks='SA*' ./...

      - name: Vulnerability scan
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
