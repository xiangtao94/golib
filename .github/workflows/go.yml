name: Go

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - pkg/elasticsearch
          - pkg/mcp
          - pkg/milvus
          - pkg/mongodb
          - pkg/orm
          - pkg/otel
          - pkg/redis
          - pkg/s3
          - testdata/consumer

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Test with race detector
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go test -race ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go vet ./...

      - name: Staticcheck correctness checks
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks='SA*' ./...

      - name: Vulnerability scan
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
